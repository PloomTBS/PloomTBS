<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikace</title>
    <style>
        /* Reset a základní nastavení bílé stránky */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Styl iOS notifikace */
        .ios-notification {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 360px;
            border-radius: 22px;
            padding: 14px 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08), 
                        0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: apperance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hlavička notifikace (Ikona, Název aplikace, Čas) */
        .notif-header {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .notif-icon {
            width: 20px;
            height: 20px;
            background-color: #1c1c1e;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
        }

        /* Malé vnitřní "i" jako zástupná ikona systému/manažeru */
        .notif-icon::after {
            content: "i";
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            font-family: "Georgia", serif;
            font-style: italic;
        }

        .notif-app-name {
            font-size: 13px;
            font-weight: 500;
            color: #000000;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: -0.1px;
        }

        .notif-time {
            font-size: 13px;
            color: #000000;
            opacity: 0.4;
            margin-left: auto;
        }

        /* Obsah samotné zprávy */
        .notif-body {
            color: #000000;
        }

        .notif-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
            color: #ff3b30; /* iOS červená pro důraz na POZASTAVENO */
        }

        .notif-message {
            font-size: 15px;
            line-height: 1.3;
            color: #1c1c1e;
        }

        .lang-en {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            opacity: 0.8;
        }

        /* Animace vyskočení notifikace */
        @keyframes apperance {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="ios-notification">
        <div class="notif-header">
            <div class="notif-icon"></div>
            <span class="notif-app-name">Management</span>
            <span class="notif-time">nyní</span>
        </div>
        <div class="notif-body">
            <div class="notif-title">POZASTAVENO / SUSPENDED</div>
            <div class="notif-message">
                <div class="lang-cs">Na žádost managementu pozastaveno.</div>
                <div class="lang-en">Suspended at the request of management.</div>
            </div>
        </div>
    </div>

</body>
</html>
